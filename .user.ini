; PHP-FPM equivalent of the php_flag / php_value directives in .htaccess.
;
; mod_php reads .htaccess; PHP-FPM does not. It reads .user.ini per directory,
; which covers PHP_INI_USER and PHP_INI_PERDIR settings — all of the ones below
; qualify. Keep this in sync with the guarded block in .htaccess.

; Never render errors to the browser. APP_DEBUG in store/.env is a separate
; switch and must also be off in production.
display_startup_errors = Off
display_errors = Off
html_errors = Off

log_errors = On
error_log = /opt/unetlab/data/Logs/php_errors.txt

session.gc_maxlifetime = 86400

; Lab and image uploads are large.
post_max_size = 200M
upload_max_filesize = 180M
