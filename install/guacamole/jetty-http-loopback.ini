# Installed by install/lib/guacamole.sh as
# /etc/jetty9/start.d/10-pnetlab-loopback.ini.
#
# /etc/jetty9/start.d/ is the override directory the Debian package nominates
# for exactly this ("Customized settings can be added to .ini files in the
# /etc/jetty9/start.d directory to avoid conflicts when updating the package").
# Editing start.ini in place would be reverted by the next package upgrade and
# would silently reopen the port to the world.
#
# Jetty's default is 0.0.0.0:8080. The only clients this server has are Apache,
# proxying /html5/ from the same host, and includes/functions.php, which posts
# to http://127.0.0.1/html5/api/tokens — also via Apache. Nothing off-box has
# any business reaching it, and an exposed :8080 is a second, unauthenticated
# front door to the same application. The PNETLab appliance leaves Tomcat on
# 0.0.0.0:8080 to this day; do not reproduce that.
#
# The property is jetty.http.host. jetty.host is its deprecated alias and is
# what the shipped start.ini comments show, which makes it the easy wrong
# answer. Verify with: ss -ltn | grep 8080
jetty.http.host=127.0.0.1
