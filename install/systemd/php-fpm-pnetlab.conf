# PNETLab needs the web layer to reach parts of the host that modern PHP-FPM
# units deliberately hide.
#
# Ubuntu ships php*-fpm.service with:
#
#     ProtectSystem=full        /usr, /boot and /etc become read-only
#     ProtectKernelTunables=yes /proc/sys and /sys become read-only
#     ProtectControlGroups=yes  /sys/fs/cgroup becomes read-only
#     PrivateDevices=yes        a private /dev with no /dev/kvm, /dev/net/tun
#
# The appliance never hit this because it ran mod_php inside Apache, which has no
# such confinement. Under FPM every one of those four blocks something PNETLab
# does on a normal node start:
#
#   ProtectSystem=full      useradd cannot create /etc/passwd.lock, so node
#                           start fails with "cannot lock /etc/passwd"
#   ProtectKernelTunables   sysctl -w net.ipv6.conf.<tap>.disable_ipv6 fails,
#                           as do the KSM writes under /sys/kernel/mm
#   ProtectControlGroups    container-backed nodes cannot be placed in cgroups
#   PrivateDevices          QEMU cannot open /dev/kvm and taps cannot open
#                           /dev/net/tun
#
# This is a real reduction in confinement and should be understood as one. It is
# scoped as tightly as the application currently allows:
#
#   - ProtectSystem drops from 'full' to 'true', which keeps /usr and /boot
#     read-only and releases /etc. ReadWritePaths=/etc alongside 'full' was
#     tried first and does NOT work: the FPM worker still saw
#     "/dev/... on /etc type ext4 (ro,relatime)" and useradd still failed.
#   - The three Protect* switches that must be off are named individually rather
#     than reaching for ProtectSystem=off.
#
# The correct long-term fix is for the web layer to stop doing any of this
# directly and to hand every privileged action to unl_wrapper, which runs as a
# separate root process outside this unit's confinement. Once that is done this
# file should shrink to nothing. See install/README.md.

[Service]
ProtectSystem=true
ReadWritePaths=/opt/unetlab
ProtectKernelTunables=no
ProtectControlGroups=no
PrivateDevices=no
