# Jetty 9 hosts the Guacamole web application that serves HTML5 consoles.
# Installed by install/lib/guacamole.sh as
# /etc/systemd/system/jetty9.service.d/pnetlab.conf.
#
# JAVA_OPTIONS, not JAVA_OPTS
# --------------------------
# Ubuntu's jetty9.service sets
#
#     Environment="JAVA_OPTS=-Djava.awt.headless=true"
#
# and /usr/share/jetty9/bin/jetty.sh — the script the unit actually runs — does
# not reference JAVA_OPTS anywhere. It builds its command line from
# JAVA_OPTIONS. The shipped setting is therefore dead, which is easy to miss
# and would make a JAVA_OPTS drop-in here silently do nothing. Set JAVA_OPTIONS,
# and carry the headless flag across so nothing is lost by overriding it.
#
# guacamole.home
# --------------
# Guacamole resolves its configuration directory in the order: the
# guacamole.home system property, the GUACAMOLE_HOME environment variable,
# $HOME/.guacamole, then /etc/guacamole. The last of those would work, but the
# unit sets WorkingDirectory=/usr/share/jetty9/ and the jetty account's $HOME is
# that same directory, so the probe order is not something to leave to a
# fallback. Both the property and the variable are set; the log line
#
#     LocalEnvironment - GUACAMOLE_HOME is "/etc/guacamole"
#
# on startup is the confirmation.
#
# Confinement — read this before relaxing anything
# ------------------------------------------------
# jetty9.service ships ProtectSystem=strict with ReadWritePaths=/var/lib/jetty9/
# and PrivateTmp=yes. That is the same class of confinement that broke the
# platform layer under PHP-FPM (see install/systemd/php-fpm-pnetlab.conf, which
# also records that ReadWritePaths=/etc alongside ProtectSystem=full does NOT
# work), so it was expected to be a problem here.
#
# It is not, and this file deliberately does not weaken it. Measured on the
# reference host: Guacamole only ever READS /etc/guacamole — reads are unaffected
# by ProtectSystem at any level — and the only thing it writes is the exploded
# war, which Jetty puts under java.io.tmpdir, i.e. the private /tmp that
# PrivateTmp=yes provides. The webapps directory and jetty.state are already
# covered by the unit's own ReadWritePaths.
#
# So: if consoles break, do NOT start by loosening ProtectSystem. Nothing here
# needed it. Look at guacamole.properties, the extensions directory and guacd
# first.
#
# Xmx
# ---
# 512 MB. Guacamole is a thin proxy — the pixels are guacd's problem, not the
# JVM's — and this box is expected to be running emulators, which want the RAM
# far more than a servlet container does.

[Service]
Environment="JAVA_OPTIONS=-Djava.awt.headless=true -Dguacamole.home=/etc/guacamole -Xmx512m"
Environment="GUACAMOLE_HOME=/etc/guacamole"
Environment="JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64"
