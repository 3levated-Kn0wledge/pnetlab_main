name: CI

on:
  push:
    branches: [main, 'phase-**']
  pull_request:
  workflow_dispatch:

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.4 is the pinned target; 8.5 is the next LTS default and is allowed
        # to fail until we deliberately move to it.
        php: ['8.4', '8.5']
    continue-on-error: ${{ matrix.php == '8.5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: tools/php-lint.sh
      - run: tools/run-tests.sh

  wrappers:
    name: Console wrappers (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the hardening flags the install uses
        # -Werror is the point: the Makefile builds with -Wall -Wextra -Werror
        # -fstack-protector-strong -D_FORTIFY_SOURCE=2, and install/lib/platform.sh
        # compiles these during the platform step and fails the install if the
        # build fails. A warning that lands here is an install that breaks on a
        # user's machine.
        run: make -C platform/wrappers/src all
      - name: Unit tests
        # The pure logic: telnet IAC handling, command assembly, option parsing,
        # NETMAP generation and the frame bounds checks. No root, no network, no
        # deployed tree -- everything here runs in a container.
        run: make -C platform/wrappers/src test
      - name: The binaries are named what the PHP invokes
        # R3 in the wrapper spec. includes/api_status.php greps for these names
        # and device::stop() kills by them, so a rename breaks node teardown
        # silently. Cheap to assert, expensive to discover.
        run: |
          for w in qemu_wrapper_telnet docker_wrapper iol_wrapper; do
            test -x "platform/wrappers/src/$w"
          done

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        # Must run from the repository root: webpack.mix.js paths and the
        # hardcoded webpackChunkName in store/resources/react/app.js are both
        # root-relative. webpack 4 also predates Node 17's OpenSSL 3 default, so
        # the legacy provider is required until the laravel-mix 6 upgrade lands.
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run production
      - name: Verify chunks landed in the expected location
        run: |
          test -f store/public/react/js/app.js
          test -d store/public/react/pages
          # A doubled path means the build ran from the wrong directory.
          test ! -d store/public/store
